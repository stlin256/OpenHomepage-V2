# ---- 站点基本信息 ----
site:
  title: "林知远 · Zhiyuan Lin"
  description: "林知远的个人主页：机器学习研究、开源项目与阅读记录"
  language: zh-CN
  favicon: "assets/favicon.svg"     # 站点图标（svg/png/ico）；删除该行则用内置默认

# ---- 个人资料（主页头部区块）----
profile:
  name: "林知远"
  tagline:
    zh: "博士研究生 / 机器学习与系统"
    en: "PhD candidate / ML & Systems"
  avatar: "assets/avatar.svg"   # 文字徽标，无需照片
  # avatar_position: "side"     # side=头像在简介右侧（默认杂志布局）；top=头像在姓名上方居顶居中
  bio_page: "index"
  links:
    - { label: "Email", url: "mailto:zhiyuan@example.com" }
    - { label: "GitHub", url: "https://github.com/octocat" }
    - { label: "Google Scholar", url: "https://scholar.google.com/" }

# ---- 主题 ----
theme:
  accent: "#3a7bd5"
  default_mode: "system"

# ---- 页脚（默认开启；显式 enabled: false 关闭；text 支持 [文字](链接) 内联链接）----
footer:
  enabled: true
  text:
    zh: "由 [OpenHomepage-V2](https://github.com/stlin256/OpenHomepage-V2) 驱动"
    en: "Powered by [OpenHomepage-V2](https://github.com/stlin256/OpenHomepage-V2)"

# ---- 背景音乐（缺省整段不启用；enabled: false 强制关闭）----
bgm:
  autoplay: true
  file: "assets/bgm.wav"        # 相对 data/ 的音频路径（wav/mp3/ogg/m4a/flac）
  volume: 0.4                   # 音量 0–1，缺省 0.4
  enabled: true                 # 页面顶端出现播放/暂停按钮；记住用户选择，站内转场不中断

# ---- GitHub 区块 ----
github:
  username: "octocat"
  show_contributions: true
  pinned:
    - repo: "huggingface/transformers"
      note: "State-of-the-art NLP for everyone —— 复现论文时的基础设施"
    - repo: "ggml-org/llama.cpp"
      note: "在笔记本上跑大模型，本地实验的起点"
    - repo: "openai/whisper"

# ---- RSS 区块 ----
rss:
  enabled: true
  block_title:
    zh: "前沿动态"
    en: "Frontier Radar"
  sources_file: "rss.yaml"

# ---- 主页布局：区块顺序完全可配置（调整列表顺序即可重排主页）----
home:
  layout:
    - block: profile
    - block: streaming
      id: "welcome"
    - block: markdown
    - block: github
    - block: rss

# ---- LLM 流式区块定义 ----
streaming_blocks:
  - id: "welcome"
    title:
      zh: "AI 助理致辞"
      en: "A word from my assistant"
    content_file: "streaming/welcome.md"
    autoplay: true
    speed: 40
