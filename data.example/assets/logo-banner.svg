<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,600&amp;display=swap');
      .brand-title {
        font-family: 'Newsreader', 'Songti SC', 'Source Han Serif SC', Georgia, 'Times New Roman', serif;
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -0.015em;
        dominant-baseline: middle;
        text-anchor: middle;
      }
      .brand-main {
        fill: #181a17;
      }
      .brand-v2 {
        fill: #c85a32;
        font-style: italic;
      }
      @media (prefers-color-scheme: dark) {
        .brand-main {
          fill: #f0ede7;
        }
        .brand-v2 {
          fill: #f87171;
        }
      }
    </style>
  </defs>
  <text x="230" y="47" class="brand-title">
    <tspan class="brand-main">OpenHomepage</tspan>
    <tspan dx="10" class="brand-v2">V2</tspan>
  </text>
</svg>