# Dependabot 依赖更新：npm 每周分组更新 + GitHub Actions 版本跟踪
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # 大版本升级单独提 PR，便于人工评估破坏性变更
    groups:
      minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      # typescript 固定 ^6：@astrojs/check 的 peer 仅支持 TS ^5||^6，
      # TS7 无语言服务 API，astro check 无法工作（见 AGENTS.md 质量门禁一节）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
