name: 💡 功能建议 / Feature Request
description: 提议新功能或改进 / Propose a new feature or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue 与 `docs/specs/` 确认未被规划。/ Please search existing issues and `docs/specs/` first.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to Solve
      description: 这个功能解决什么痛点？/ What pain point does this address?
      placeholder: 当我 … 时，总是需要手动 …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: 期望的交互/行为，可附草图或参考实现 / Desired behavior; sketches or references welcome
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives Considered
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿 / Contribution
      options:
        - label: 我愿意提交 PR 实现该功能 / I'm willing to submit a PR for this
          required: false
