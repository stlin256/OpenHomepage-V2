# CI 质量门禁：类型检查（astro check）+ 单元测试与覆盖率门槛（vitest run --coverage）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 代码检查 / Lint (eslint)
        run: npm run lint

      - name: 类型检查 / Type check (astro check)
        run: npm run check

      # data/ 是私有数据且被 git 忽略，CI 检出后不存在；tests/search.test.ts 等
      # 用例依赖该目录，按 deploy.yml 示例模式用 data.example/ 兜底播种
      - name: 准备示例数据 / Seed example data (data.example → data)
        run: test -d data || cp -r data.example data

      - name: 单元测试 + 覆盖率门槛 / Unit tests with coverage thresholds (vitest run --coverage)
        run: npm run test:coverage

  # 最小 e2e 冒烟：构建 dist/ 后用 Playwright 跑 e2e/*.spec.ts（astro preview 直出）
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 准备示例数据 / Seed example data (data.example → data)
        run: test -d data || cp -r data.example data

      # 轻量构建：冒烟不依赖 OG 图与图片/CSS 优化；ASTRO_BASE='/' 固定根 base，
      # 避免 GITHUB_ACTIONS 下自动取仓库名作 base 导致预览路径漂移
      - name: 构建 / Build (fonts + astro build)
        run: tsx scripts/generate-fonts.ts && npx astro build
        env:
          ASTRO_BASE: '/'

      # PLAYWRIGHT_BROWSERS_PATH=0 把浏览器装进 node_modules（同 scripts/screenshots.ts 约定）
      - name: 安装 Playwright Chromium / Install Playwright Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium

      - name: e2e 冒烟 / Playwright smoke tests
        run: npm run test:e2e

      - name: 上传测试报告 / Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
