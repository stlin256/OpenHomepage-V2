# CI 质量门禁：类型检查（astro check）+ 单元测试（vitest run）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 类型检查 / Type check (astro check)
        run: npm run check

      - name: 单元测试 / Unit tests (vitest run)
        run: npm test
