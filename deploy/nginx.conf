server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Astro emits content-hashed bundles under /_astro/ — safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Subset fonts are stable across deploys of the same content.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Page assets (images, OG cards, media).
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML: always revalidate so content updates propagate immediately.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }
}
